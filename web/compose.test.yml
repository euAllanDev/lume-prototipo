name: lume-auth-integration

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lume_auth_test
      POSTGRES_PASSWORD: lume_test_only
      POSTGRES_USER: lume_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lume_test -d lume_auth_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: 100
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20
